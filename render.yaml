services:
  # 前端服务 (React + Vite + TypeScript)
  - type: web
    name: medical-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://langgraph-project-5dqx.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
