services:
  # 后端服务 (Node.js + Express + LangGraph)
  - type: web
    name: medical-backend
    runtime: node
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/health

  # 前端服务 (React + Vite + TypeScript)
  - type: web
    name: medical-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://medical-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
